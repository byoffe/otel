networks:
  observability:
    driver: bridge

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:

services:

  # ── OTEL Collector ──────────────────────────────────────────────────────────
  # Central hub: receives OTLP from all apps, fans out to Tempo/Prometheus/Loki.
  # App OTLP endpoint: localhost:4317 (gRPC) or localhost:4318 (HTTP)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC  — apps send traces/metrics/logs here
      - "4318:4318"   # OTLP HTTP  — alternative transport
      - "8889:8889"   # Prometheus scrape endpoint (Collector exposes metrics here)
      - "13133:13133" # Collector health check
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Tempo (traces) ──────────────────────────────────────────────────────────
  # Receives traces forwarded by the Collector (internal port 4317).
  # UI/API at localhost:3200
  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API + search UI
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Prometheus (metrics) ────────────────────────────────────────────────────
  # Scrapes metrics from the Collector's /metrics endpoint every 15s.
  # UI at localhost:9090
  prometheus:
    image: prom/prometheus:v2.51.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI + API
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Loki (logs) ─────────────────────────────────────────────────────────────
  # Receives logs forwarded by the Collector.
  # API at localhost:3100
  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"   # Loki HTTP API
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Grafana (visualization) ─────────────────────────────────────────────────
  # Datasources (Tempo, Prometheus, Loki) and the OTEL Overview dashboard are
  # provisioned automatically from grafana/provisioning/ — no manual setup needed.
  # UI at localhost:3000  credentials: admin / admin
  grafana:
    image: grafana/grafana:10.4.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - observability
